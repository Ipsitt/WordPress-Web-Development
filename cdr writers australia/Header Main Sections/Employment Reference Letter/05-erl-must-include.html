<style>

.tra.tra.tra-erl-05 .erl-tx b{display:block;font-size:16.5px;line-height:1.35}

.tra.tra.tra-erl-05 .erl-cl li.done{background:#fdf3f3;border-color:#f0c4c6}

.tra.tra.tra-erl-05 .erl-side{position:sticky;top:90px;background:var(--slate);color:#fff;border-radius:18px;padding:30px 24px;text-align:center;box-shadow:0 20px 44px rgba(47,51,71,.35)}

</style>
<section class="tra tra-erl-05" aria-label="What an employment reference letter must include">
<div class="tra-white"><div class="tra-wrap"><h2 class="tra-h">What must an employment reference letter include?</h2><p class="tra-sub">Note: Requirements differ slightly between assessing authorities.</p><div class="erl-ckw"><ul class="erl-cl"><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Company letterhead</b><small>Employer name, address and website, ideally with a registration number such as an ABN.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Your full name</b><small>Written exactly as it appears on your passport and application.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Date of the letter</b><small>The day the employer issued and signed it.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Job title for each role</b><small>Every position held, with its own dates if you were promoted.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Start and end dates</b><small>Written DD/MM/YYYY. A current role shows the start date and "current".</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Employment status and weekly hours</b><small>Full-time, part-time, casual or contract, with minimum paid hours per week.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Work location</b><small>The city and country where you did the work, such as Australia or overseas.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Duties you performed</b><small>Bullet points in your own words that match the occupation, never copied from the ANZSCO.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Salary and benefits</b><small>Annual pre-tax salary or rate, plus any benefits the employer provides.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Authorised signature and date</b><small>A manager, supervisor or HR officer. Digital signatures should carry a verification certificate.</small></span></label></li><li><label><input type="checkbox"><span class="erl-bx"></span><span class="erl-tx"><b>Signatory details</b><small>Full name, position, phone number and a work email address, not a personal one.</small></span></label></li></ul><div class="erl-side" id="erlside"><div class="erl-ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="65"/><circle class="fg" cx="75" cy="75" r="65"/></svg><b>0%</b></div><p class="erl-msg">Start ticking</p><p class="erl-sm">0 of 11 items checked</p><button type="button" class="erl-reset">Reset</button></div></div></div></div>
<script>(function(){var cs=document.currentScript;var root=(cs&&cs.closest&&cs.closest('.tra'))||document.querySelector('.tra-erl-05');if(!root)return;var N=11;var cbs=root.querySelectorAll('.erl-cl input'),fg=root.querySelector('.fg'),pc=root.querySelector('.erl-ring b'),msg=root.querySelector('.erl-msg'),sm=root.querySelector('.erl-sm'),sd=root.querySelector('.erl-side');var L=['Start ticking','Good start','Halfway there','Nearly done','Almost perfect','Letter looks complete'];function upd(){var c=0;cbs.forEach(function(b){b.closest('li').classList.toggle('done',b.checked);if(b.checked)c++});var p=c/N;fg.style.strokeDashoffset=408*(1-p);pc.textContent=Math.round(p*100)+'%';sm.textContent=c+' of '+N+' items checked';msg.textContent=c===N?L[5]:L[Math.min(4,Math.floor(p*5))];sd.classList.toggle('full',c===N)}cbs.forEach(function(b){b.addEventListener('change',upd)});root.querySelector('.erl-reset').addEventListener('click',function(){cbs.forEach(function(b){b.checked=false});upd()});upd();})();</script>
</section>

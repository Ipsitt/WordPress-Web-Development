          "@type": "Question",
          "name": "What is a Competency Demonstration Report (CDR) for Engineers Australia skill assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A CDR is a technical document submitted to Engineers Australia. It comprises three Career Episodes, a Summary Statement and a CPD list, and it is required for overseas-trained engineers applying for skilled migration visas such as subclass 189, 190 or 491."
          }
        },
        {
          "@type": "Question",
          "name": "How many career episodes are required in a CDR for Engineers Australia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Three. Each Career Episode describes a separate engineering project you personally worked on, written in the first person, and each should be 1,000 to 2,500 words."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Engineers Australia CDR skill assessment fee in 2025?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia sets and changes the fee, so check its website before applying. For 2026 to 2027 its published standard CDR fee is A$1,034 including GST (A$940 excluding GST). The figure of about AUD 907.50 applied to an earlier period."
          }
        },
        {
          "@type": "Question",
          "name": "How long does Engineers Australia take to process a CDR application?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia says standard applications are generally assigned to an assessor within about 15 weeks, and this is not the time to an outcome. Complex or incomplete submissions can take longer, so apply well before your visa deadline."
          }
        },
        {
          "@type": "Question",
          "name": "What is the acceptance rate for Competency Demonstration Reports submitted to Engineers Australia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia does not publish an official acceptance rate. Rejections are common for first-time applicants, often because of plagiarism, weak personal contribution, or Summary Statements that do not match the criteria."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if my CDR is rejected by Engineers Australia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can resubmit after fixing the issues in the rejection notice, and the full assessment fee applies again. A professional review before resubmitting is strongly recommended."
          }
        },
        {
          "@type": "Question",
          "name": "Who needs to submit a CDR to Engineers Australia for Australian PR?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Overseas-trained engineers whose qualifications are not accredited under the Washington, Sydney or Dublin Accords generally need to submit a CDR to obtain a positive skills assessment for Australian PR."
          }
        },
        {
          "@type": "Question",
          "name": "What are the most common CDR rejection reasons by Engineers Australia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Common reasons are plagiarised content, using \"we\" instead of \"I\", Career Episodes that describe the same project, weak Summary Statement mapping, and Career Episodes that lack technical depth."

          "@type": "Question",
          "name": "Who needs to submit a CDR for Engineers Australia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers whose qualifications are not accredited under the Washington, Sydney, or Dublin Accord must submit one for a positive skills assessment for skilled migration."
          }
        },

          "@type": "Question",
          "name": "What are the key components of a CDR report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Three Career Episodes, a Summary Statement, and a Continuing Professional Development list, prepared to Engineers Australia guidelines."
          }
        },

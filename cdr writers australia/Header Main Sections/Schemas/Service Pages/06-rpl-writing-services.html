        {
          "@type": "Question",
          "name": "What is an ACS RPL report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An ACS RPL report is part of the Recognition of Prior Learning pathway of the Australian Computer Society skills assessment. It lets you show ICT skills gained through work experience when you have no formal ICT qualification, or a qualification that is not ICT-related."
          }
        },
        {
          "@type": "Question",
          "name": "Who needs an RPL for ACS assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Applicants without a qualification that ACS accepts as ICT-relevant, who have substantial ICT work experience and want a skills assessment for Australian migration. Check ACS's current rules to confirm whether you need the RPL pathway."
          }
        },
        {
          "@type": "Question",
          "name": "How many project reports does the ACS RPL need?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ACS asks RPL applicants for two project reports that show the ICT skills and knowledge used in your work, along with a CV, evidence of employment and your qualifications. Confirm the current requirements on the ACS website before you write."
          }
        },
        {
          "@type": "Question",
          "name": "How do I choose projects for my RPL?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Choose two projects where you personally performed the ICT work, and where the skills line up with the ANZSCO code you are applying under. Describe your own role and decisions, not just what the team did."
          }
        },
        {
          "@type": "Question",
          "name": "How long does an ACS RPL assessment take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ACS publishes its own processing times, and they change with workload and application completeness. Check the ACS website for the current figure rather than relying on a fixed number."
          }
        },
        {
          "@type": "Question",
          "name": "Can someone else write my RPL for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ACS expects the RPL content to be your own original work. Guidance, structure advice and review are different from authorship, so you should write the project reports in your own words from your own experience."
          }
        }

        {
          "@type": "Question",
          "name": "Is IPENZ the same as Engineering New Zealand?",

            "@type": "Answer",
            "text": "Yes. IPENZ is the former name of Engineering New Zealand, which is why many people still say IPENZ KA02."

        {
          "@type": "Question",
          "name": "What does Engineering New Zealand assess for migration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineering New Zealand runs a credential check of your qualification and, where your qualification is not recognised under the Washington Accord, a knowledge assessment commonly called the KA02. Chartered Member and CPEng assess competence separately."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a KA02 if I have a Washington Accord degree?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Engineering New Zealand states that holders of a Washington Accord qualification do not need a knowledge assessment."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Engineering New Zealand credential check?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is a check of your qualification and identity. Engineering New Zealand says it typically takes 7 to 10 working days after payment, and it is free for financial members and $550 excluding GST for non-members."
          }
        },
        {
          "@type": "Question",
          "name": "How much does the knowledge assessment cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineering New Zealand lists $1,425 for the standard knowledge assessment and $1,977 for fast track, both excluding GST. Check its fees page before paying, because fees can change."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between KA02 and CPEng?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A KA02 shows that your engineering knowledge is equivalent to a Washington Accord graduate. CPEng is a registration that assesses competence and requires New Zealand engineering experience."
          }

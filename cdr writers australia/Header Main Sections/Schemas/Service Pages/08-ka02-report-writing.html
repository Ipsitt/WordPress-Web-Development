      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a KA02 report for Engineering New Zealand?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KA02 is the name commonly used for the knowledge assessment run by Engineering New Zealand, formerly IPENZ. It shows that your engineering knowledge is equivalent to a Washington Accord graduate when your qualification is not recognised under the Accord."
          }
        },
        {
          "@type": "Question",
          "name": "Who needs to submit a KA02 report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers whose qualification is not recognised under the Washington Accord and who need a knowledge assessment from Engineering New Zealand for immigration, Chartered Member or CPEng purposes. Holders of a Washington Accord qualification do not need one."
          }
        },
        {
          "@type": "Question",
          "name": "What are the key components of a KA02 report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A KA02 submission typically contains personal and education details, work samples describing your own engineering projects, a Knowledge Profile self-assessment linking each knowledge area to your evidence, a continuing learning record and supporting documents. Always follow Engineering NZ's current guidance and checklist."
          }
        },
        {
          "@type": "Question",
          "name": "How is KA02 different from a CDR report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A KA02 goes to Engineering New Zealand and shows knowledge equivalent to a Washington Accord graduate. A CDR goes to Engineers Australia for an Australian migration skills assessment and uses Career Episodes, a CPD list and a Summary Statement."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to prepare a KA02 report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Preparation time depends on your experience, documents and the depth of evidence needed. Engineering NZ states a credential check typically takes 7 to 10 working days after payment, and it does not publish a single turnaround for the knowledge assessment itself."
          }
        },
        {
          "@type": "Question",
          "name": "What are common mistakes in KA02 reports?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Common mistakes are weak explanations of your own role, missing evidence, poor structure, copied content, gaps in the Knowledge Profile and using old fee or timeline information."
          }
        },
        {
          "@type": "Question",
          "name": "What level of experience is required for KA02?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A KA02 shows equivalent knowledge rather than a set number of years. Your work samples should show real engineering work you personally carried out. Chartered or CPEng status is separate and needs competence and New Zealand engineering experience."
          }
        }
      ]

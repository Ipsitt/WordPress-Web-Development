        {
          "@type": "Question",
          "name": "What is the National Engineering Register (NER)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The NER is Engineers Australia's register of engineers who have shown they meet competencies for their area of engineering. Registration is an annual subscription, and you are listed in a publicly searchable database."
          }
        },
        {
          "@type": "Question",
          "name": "What do I need to apply for NER registration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You need an Engineers Australia recognised engineering qualification, a successful migration skills assessment or a membership competency assessment, plus five or more years of relevant full-time equivalent engineering experience. At least four of those years must be after graduation, and the experience must fall within the last 10 years."
          }
        },
        {
          "@type": "Question",
          "name": "Do I have to be an Engineers Australia member to apply?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Non-members can apply, though they also upload photo ID and evidence of their qualifications, and pay a higher fee."
          }
        },
        {
          "@type": "Question",
          "name": "What are the NER assessment steps?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia describes five steps: self-assessment against the NER competencies, an online application with an expanded CV, referee review, confirmation of eligibility, and an interview with a qualified assessor."
          }
        },
        {
          "@type": "Question",
          "name": "How many referees does the NER need?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Two referees who have worked with you in the last five years. They should be Chartered members, NER-registered or have more than five years of post-graduate experience."
          }
        },
        {
          "@type": "Question",
          "name": "How much does NER registration cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia's NER page lists an assessment fee of $410 for members and $670 for non-members, and an annual fee of $130 for members and $215 for non-members, including GST. Check the page for current amounts."
          }
        }

        {
          "@type": "Question",
          "name": "What is a NER work experience statement?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is the expanded CV you upload in your NER application. It describes the projects you were responsible for and your key achievements, so the assessor can see how you meet the NER competencies."
          }
        },
        {
          "@type": "Question",
          "name": "What should the statement cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia says to describe the situations, problems and opportunities you faced, the specialist skills or knowledge you used, the outcomes you achieved and the actions you took, including any innovation and creativity."
          }
        },
        {
          "@type": "Question",
          "name": "How much experience must it show?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Five or more years of relevant full-time equivalent engineering experience, with at least four years after graduation, and within the last 10 years."
          }
        },
        {
          "@type": "Question",
          "name": "Does the NER involve an interview?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The final step is an interview with a qualified Engineers Australia assessor, usually held online by video, to confirm your evidence shows the competencies. The assessor also contacts your referees."
          }
        },
        {
          "@type": "Question",
          "name": "Who can be my referees?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Two people who have recently worked with you and know your work. They should preferably be Chartered members of Engineers Australia, NER-registered or have more than five years of post-graduate experience."
          }
        },
        {
          "@type": "Question",
          "name": "Is there an official NER work experience statement template?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia describes what the expanded CV should cover but does not publish a model statement. Use its guidance and write about your own projects in your own words."
          }

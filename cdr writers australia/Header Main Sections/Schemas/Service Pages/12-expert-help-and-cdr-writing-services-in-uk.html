        {
          "@type": "Question",
          "name": "What is a CDR and who needs one?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Competency Demonstration Report is a set of documents submitted to Engineers Australia for a migration skills assessment. It is for engineers whose qualifications are not accredited under the Washington, Sydney or Dublin Accords or who are otherwise directed to the CDR pathway."
          }
        },
        {
          "@type": "Question",
          "name": "What does a CDR contain?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Three Career Episodes, a Summary Statement that maps your competency evidence to numbered paragraphs, and a CPD statement, along with identity, qualification and English-language documents."
          }
        },
        {
          "@type": "Question",
          "name": "How much is the Engineers Australia CDR assessment fee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For 2026 to 2027 Engineers Australia lists A$1,034 including GST for a standard CDR assessment, with add-ons such as a skilled employment assessment priced separately. Check its fees page for current amounts."
          }
        },
        {
          "@type": "Question",
          "name": "Can UK-based engineers apply for an Engineers Australia assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can apply online from the UK. A UK degree is assessed under the Washington Accord route if it is on the accredited list, and otherwise you may need the CDR pathway."
          }
        },
        {
          "@type": "Question",
          "name": "How long does Engineers Australia take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engineers Australia says standard applications are generally assigned to an assessor within about 15 weeks. That is not the time to an outcome, so allow extra time."
          }
        },
        {
          "@type": "Question",
          "name": "Can a writer write my Career Episodes for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Engineers Australia prohibits having a third party write your Career Episodes or Summary Statement, with penalties that include rejection and a ban. Guidance and review are fine, but you must write the content yourself."
          }
        }

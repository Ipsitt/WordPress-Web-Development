          "@type": "Question",
          "name": "What is the IMarEST CEng?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chartered Engineer (CEng) is a professional title awarded in the UK through licensed bodies such as IMarEST under the Engineering Council. It recognises advanced knowledge, competence and professional commitment."
          }
        },
        {
          "@type": "Question",
          "name": "What standard is CEng assessed against?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Engineering Council's UK-SPEC, which sets competence and commitment standards covering knowledge and understanding, design and development, responsibility and leadership, communication, and professional commitment."
          }
        },
        {
          "@type": "Question",
          "name": "What does the CEng application involve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An application form, your CV, academic certificates, a CPD record and a Professional Review Report, followed by a Professional Review Interview. Check IMarEST's current guidance for the exact documents."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a master's degree for CEng?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CEng usually needs an accredited MEng, or an accredited bachelor's degree plus further learning, or a route for those with other qualifications. IMarEST can advise on which route fits your education."
          }
        },
        {
          "@type": "Question",
          "name": "How much does CEng cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Costs generally include an application or assessment fee, annual IMarEST membership and an Engineering Council registration fee. Amounts change, so check IMarEST for the current figures."
          }
        },
        {
          "@type": "Question",
          "name": "Can someone write my Professional Review Report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The report should describe your own experience in your own words. Guidance and review can help with structure and clarity, but IMarEST expects the content to be yours."

        {
          "@type": "Question",
          "name": "What is the P.Eng competency assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is the competency-based assessment Engineers and Geoscientists BC (EGBC) uses to evaluate your engineering work experience. You write work examples, rate yourself against the competencies, and your validators confirm and score them."
          }
        },
        {
          "@type": "Question",
          "name": "How many competencies are in the EGBC P.Eng competency assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "There are 34 competencies across seven categories. Eight of them are Canadian environment competencies, and each has its own minimum rating."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to get a P.Eng with EGBC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EGBC requires at least four years of engineering experience. Review takes about six months after a complete application is submitted, and delays with validators or documents can extend that."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need Canadian experience to get a P.Eng in BC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, but you must meet the eight Canadian environment competencies, and overseas experience must be shown to be equivalent because it does not count automatically."
          }
        },
        {
          "@type": "Question",
          "name": "What experience counts toward EGBC's four-year minimum?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Up to one year of supervised pre-graduation or co-op experience can count. Postgraduate study can earn credit, up to one year for a thesis master's degree and two years for a PhD."
          }
        },
        {
          "@type": "Question",
          "name": "What score do I need in each EGBC competency category?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most categories require an average of at least 3 out of 5. Project and Financial Management and Social, Economic, Environmental and Sustainability require 2. Applicants are not expected to reach 4 or 5."
          }
        },
        {
          "@type": "Question",
          "name": "How many validators do I need for an EGBC application?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "At least four validators are needed, who together cover at least four years of your experience. One must be a supervisor in the same or a related discipline."
          }
        },
        {
          "@type": "Question",
          "name": "How do I write an EGBC competency example?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the Situation, Action, Outcome structure in the first person. Keep the context brief, focus on your own actions and judgements, quantify results where possible and use recent examples."
          }
        },
        {
          "@type": "Question",
          "name": "What is the NPPE and when do I get my result?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The National Professional Practice Examination covers professionalism, law and ethics, and is separate from the competency assessment. EGBC says results post to the status portal about three to four weeks after the exam."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between APEGBC and EGBC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "They refer to the same regulator. APEGBC is the older abbreviation, and EGBC is the name adopted for everyday use in 2017."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use AI for my EGBC competency examples?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. EGBC prohibits using AI to create or embellish workplace examples, and doing so can lead to disciplinary action. Help with structure and clarity is acceptable as guidance."
          }
        }
      ]

        {
          "@type": "Question",
          "name": "What is the IEPNG Competency-Based Assessment (CBA)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "IEPNG reviews your qualifications and work experience to decide whether they meet Papua New Guinean standards for your occupation."
          }
        },
        {
          "@type": "Question",
          "name": "Who is required to undergo the IEPNG CBA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Local engineering graduates and expatriate engineers who want professional registration or a work permit in Papua New Guinea must complete it."
          }
        },
        {
          "@type": "Question",
          "name": "What are the primary registration categories under IEPNG?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Applicants can register as a Professional Engineer, Engineering Technologist or Engineering Technician, depending on their qualifications and the complexity of the work they can do."
          }
        },
        {
          "@type": "Question",
          "name": "What is the significance of the Washington Accord for IEPNG?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Graduates of Washington Accord-accredited institutions often receive a streamlined assessment. Others must submit a detailed Competency Report showing equivalent knowledge and capability."
          }
        },
        {
          "@type": "Question",
          "name": "What is the role of the Continuing Professional Development (CPD) record?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Applicants list their CPD hours from the last three years on Form CA05 to show they have kept their skills current."
          }
        },
        {
          "@type": "Question",
          "name": "How long does provisional membership last?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Provisional Membership and Registration certificates are valid for six months. IEPNG estimates about two weeks to issue provisional membership once documents are in order."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I do not finish within six months?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Provisional registration or membership can be cancelled, and an expatriate's work permit can be cancelled. Charges may follow under the Professional Engineers Registration Act, and fees are not refunded."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need PERB registration as well as IEPNG membership?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Practising engineering in Papua New Guinea requires both PERB registration and IEPNG membership, and a successful CBA produces both certificates."
          }
        },
        {
          "@type": "Question",
          "name": "How much does IEPNG registration cost for a foreign engineer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The page cites a registration fee and an annual membership fee per foreign applicant, usually paid by the employer. IEPNG's own pages do not list amounts, so confirm current fees with IEPNG."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a work permit before IEPNG registration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. For expatriates, registration comes first, and the work permit application can be submitted afterwards."
          }
        }

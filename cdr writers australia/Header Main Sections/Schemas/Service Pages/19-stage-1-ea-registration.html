        {
          "@type": "Question",
          "name": "What exactly is Stage 1 Competency?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sets the knowledge and skill level needed to enter the engineering profession and confirms a qualification meets the benchmark for Professional Engineer, Engineering Technologist or Engineering Associate."
          }
        },
        {
          "@type": "Question",
          "name": "Who needs to apply for a Stage 1 Assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "People with overseas engineering qualifications not automatically recognised under the Washington, Sydney or Dublin Accords who need formal registration or a migration skills assessment."
          }
        },
        {
          "@type": "Question",
          "name": "What are the three main occupational categories in Stage 1?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Professional Engineer (4-year degree), Engineering Technologist (3-year degree), Engineering Associate (2-year advanced diploma or associate degree)."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Washington Accord affect Stage 1 registration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Graduates from signatory countries with programs accredited by that nation's engineering body may qualify for a streamlined pathway without a full CDR."
          }
        },
        {
          "@type": "Question",
          "name": "What is the role of the \"Summary Statement\" in Stage 1?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It cross-references Career Episode paragraphs to the 16 mandatory competency elements to show each requirement is met."
          }
        },
        {
          "@type": "Question",
          "name": "Can I achieve Stage 1 through \"Experience\" alone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Stage 1 is mainly an educational assessment; applicants without a formal qualification must show equivalent knowledge via a Stage 1 Academic Assessment."
          }
        },
        {
          "@type": "Question",
          "name": "What is the English language requirement for Stage 1?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most applicants need IELTS, PTE Academic or TOEFL iBT results; exemptions may apply for Australian engineering degree holders or citizens of certain English-speaking countries."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a Stage 1 Skills Assessment outcome last?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Outcome letter generally valid for three years for migration purposes; membership recognition typically does not expire."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I apply for the wrong occupational category?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EA may offer assessment as an Engineering Technologist if the degree does not meet Professional Engineer level, often when the degree is more practical or narrowly focused."
          }
        }

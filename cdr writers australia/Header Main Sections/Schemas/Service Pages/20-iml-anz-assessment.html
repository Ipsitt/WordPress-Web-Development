        {
          "@type": "Question",
          "name": "What is the IML ANZ Skills Assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It checks whether your senior management experience and qualifications meet Australian standards for specific leadership occupations, such as Chief Executive or Procurement Manager."
          }
        },
        {
          "@type": "Question",
          "name": "Who should apply for an IML ANZ assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Senior managers and executives who need a formal skills assessment for Australian migration under the relevant ANZSCO codes."
          }
        },
        {
          "@type": "Question",
          "name": "How much does an IML ANZ skills assessment cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "From 21 September 2026, the regular assessment is $820 excluding GST outside Australia, or $902 including GST inside Australia. Express adds $218 or $240, payable at lodgement."
          }
        },
        {
          "@type": "Question",
          "name": "How much management experience is required?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Typically at least three years of recent, relevant senior management experience, supported by an organisational chart showing your position relative to the CEO or Board."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the IML skills assessment take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "IML's targets are 10 weeks for regular and 6 weeks for express, counted from a complete application. Incomplete applications take longer."
          }
        },
        {
          "@type": "Question",
          "name": "Is a university degree mandatory for IML ANZ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. A relevant degree is preferred, but applicants with extensive senior experience, usually five years or more, may be considered."
          }
        },
        {
          "@type": "Question",
          "name": "Why is professional documentation support vital for IML ANZ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Management roles are often described subjectively, so professional guidance can help your job descriptions and reference letters use the language and metrics IML looks for."
          }
        },
        {
          "@type": "Question",
          "name": "How long is an IML ANZ assessment valid?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Generally three years from issue, though some older outcomes last two years. The outcome letter states the exact period."
          }
        },
        {
          "@type": "Question",
          "name": "Can recent graduates apply for an IML skills assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. IML requires work experience for every occupation it assesses, so graduates without management experience do not qualify."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need an English test for an IML assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. IML does not require an English language test for the skills assessment."
          }
        },
        {
          "@type": "Question",
          "name": "Can I be assessed for more than one occupation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not in the same application. You can lodge a reassessment within 12 months to nominate a different occupation."
          }
        },
        {
          "@type": "Question",
          "name": "Can I get a refund if I withdraw or if I am unsuccessful?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fees are not refunded after an unsuccessful outcome. If you withdraw within 2 business days of lodging, you receive a refund minus a $50 administration fee."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a review, a reassessment and an appeal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A review is reconsidered by a different IML assessor within 90 days. A reassessment is a new application within 12 months. An appeal is an independent VETASSESS review, available only after a review."
          }
        }

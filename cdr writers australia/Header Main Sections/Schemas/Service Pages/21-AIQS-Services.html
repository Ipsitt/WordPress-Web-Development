        {
          "@type": "Question",
          "name": "What is the AIQS Skills Assessment for migration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AIQS checks whether your qualifications and work experience meet the standard for Quantity Surveyor (ANZSCO 233213)."
          }
        },
        {
          "@type": "Question",
          "name": "Who is eligible for an AIQS assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "People with a Quantity Surveying degree, or a related field such as Construction Management, who plan to migrate under skilled visa pathways need a positive AIQS assessment."
          }
        },
        {
          "@type": "Question",
          "name": "What are the different pathways for AIQS assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The page lists four: Australian accredited qualifications, non-accredited Australian qualifications, overseas-qualified applicants with experience, and current voting members of recognised professional bodies such as RICS."
          }
        },
        {
          "@type": "Question",
          "name": "How long does an AIQS skills assessment take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Up to five months overall. The documentation review can take up to three months, assessors aim to finish within two more, and complex files take longer."
          }
        },
        {
          "@type": "Question",
          "name": "What documents are required for an AIQS application?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Certified copies of your degree and transcripts, a detailed CV, employment references, identification documents and proof of English proficiency (IELTS or PTE)."
          }
        },
        {
          "@type": "Question",
          "name": "How long is a positive AIQS assessment valid?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Generally two years from the date of issue, giving you time to lodge a visa application with the Department of Home Affairs."
          }
        },
        {
          "@type": "Question",
          "name": "Can engineers apply for an AIQS assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Civil engineers or construction managers can apply if they show significant experience and academic units focused on construction economics, measurement and project financial management."
          }
        },
        {
          "@type": "Question",
          "name": "What are the benefits of a professional AIQS review?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A review helps your application highlight the right competency areas, align job descriptions with AIQS terminology and reduce the risk of rejection for insufficient evidence."
          }
        },
        {
          "@type": "Question",
          "name": "Can I apply with a civil engineering degree?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AIQS may consider allied disciplines such as civil engineering, but this is never guaranteed. General engineering, mechanical, electrical and software degrees are not treated as allied."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need an English test for AIQS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Applicants on Pathways 3 and 4 need a Home Affairs-approved test at IELTS band 6 or equivalent in each component, unless exempt. Results from different sittings cannot be combined."
          }
        },
        {
          "@type": "Question",
          "name": "Can I get an assessment based on work experience alone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your qualification must be assessed as suitable before any work experience is considered."
          }
        },
        {
          "@type": "Question",
          "name": "Who can write my AIQS reference letter?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A direct supervisor who is a practising quantity surveyor and meets AIQS's degree or membership requirement. HR and professional managers cannot write them, and each letter must be unique."
          }
        },
        {
          "@type": "Question",
          "name": "How much does the AIQS skills assessment fee cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The page lists AUD 555 for Qualifications Only, AUD 655 for Pathways 1 to 4, AUD 350 for reassessment and AUD 400 for appeals, all excluding GST. A credit card surcharge applies. Confirm current fees with AIQS before paying."
          }
        }
      ]

          "@type": "Question",
          "name": "What is a VETASSESS skill assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It checks your qualifications and work experience against the criteria for your nominated occupation. Qualifications are compared with the AQF, and employment is checked for relevance and skill level."
          }
        },
        {
          "@type": "Question",
          "name": "What does VETASSESS assess?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It evaluates your qualifications and work experience to decide whether they meet Australian standards for your nominated occupation."
          }
        },
        {
          "@type": "Question",
          "name": "Can I apply without work experience?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on the occupation group and qualification level. Some occupations require post-qualification work experience."
          }
        },
        {
          "@type": "Question",
          "name": "What is highly relevant employment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Work that closely matches the tasks and skill level in the ANZSCO description for your occupation."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the assessment take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Processing times vary with the occupation category and the volume of applications."
          }
        },
        {
          "@type": "Question",
          "name": "Can incorrect occupation selection affect my outcome?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Choosing the wrong occupation category can affect eligibility and the assessment result."
          }
        },
        {
          "@type": "Question",
          "name": "Does VETASSESS deduct experience?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It sets a Date Deemed Skilled. The qualifying period of highly relevant work is not counted again for points test advice, so only employment after that date earns points. Your actual work history does not change."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a VETASSESS application take for trades?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on the specific program and whether all evidence is supplied, so check the guidelines for your occupation. For professional occupations, VETASSESS currently quotes about 7 weeks."
          }
        },
        {
          "@type": "Question",
          "name": "Does VETASSESS expire?",

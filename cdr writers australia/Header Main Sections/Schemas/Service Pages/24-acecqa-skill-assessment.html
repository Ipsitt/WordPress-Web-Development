          "@type": "Question",
          "name": "How long does an ACECQA skills assessment take?",

            "@type": "Answer",
            "text": "ACECQA aims to finish within 80 calendar days of receiving an Assessment Ready application; missing information delays the start and there is no fast-track option."
          }

          "@type": "Question",
          "name": "Does ACECQA need IELTS for an early childhood teacher skills assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Teacher route asks for IELTS Academic 7.0 in reading and writing and 8.0 in speaking and listening, taken within three years; ISLPR Level 4 in all four skills, or a year of full-time tertiary study in an exempt country, may also be accepted."
          }
        },
        {
          "@type": "Question",
          "name": "How much work experience do I need for an ACECQA assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Centre Managers need three years and group leaders one year, full-time equivalent, in a regulated service, with at least six months within the last three years. Teacher, child care worker and OSHC worker routes list no experience requirement."

          "@type": "Question",
          "name": "What does AIMS assess?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AIMS reviews your qualifications and work experience to see whether they meet Australian standards for your occupation."
          }
        },
        {
          "@type": "Question",
          "name": "Can I apply without work experience?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on your occupation and qualification level, since some roles require experience after qualifying."
          }
        },
        {
          "@type": "Question",
          "name": "What is highly relevant employment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is work whose tasks, skills and responsibilities closely match the occupation standards."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the assessment take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Processing time varies by occupation type and application volume."
          }
        },
        {
          "@type": "Question",
          "name": "Can incorrect occupation selection affect my outcome?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Picking the wrong category may affect your eligibility or result."
          }
        },
        {
          "@type": "Question",
          "name": "Which occupations does AIMS assess for migration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Medical Laboratory Scientist (ANZSCO 234611), Medical Laboratory Scientist with the IVF Embryologist specialisation (234611), Medical Laboratory Technician (311213), and Pathology Collector or Phlebotomist (311216)."
          }
        },
        {
          "@type": "Question",
          "name": "How much does an AIMS skills assessment cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The assessment fee is AUD 900 excluding GST for applicants outside Australia, or AUD 990 including 10% GST for applicants in Australia. A professional examination costs an extra AUD 800 or AUD 880. Fees may change, so check AIMS's fee page before paying."
          }
        },
        {
          "@type": "Question",
          "name": "Is AIMS membership enough for migration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Membership cannot be used for migration. You can apply for it alongside an assessment, but only the skills assessment counts for a visa."
          }
        },
        {
          "@type": "Question",
          "name": "How long is an AIMS skills assessment valid?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Three years from the date of the original Stage 1 results letter."
          }
        },
        {
          "@type": "Question",
          "name": "Can I appeal an AIMS skills assessment outcome?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can request a free review by email within one month of your Stage 1 results letter. If you still disagree, you can appeal by email within one month of the review result, and an appeal fee applies."
          }
        },
        {
          "@type": "Question",
          "name": "Does a positive AIMS skills assessment guarantee a visa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. AIMS does not give migration advice, and a positive assessment is only one part of a skilled visa application. The Department of Home Affairs or a registered migration agent can advise on visas."
          }
        }

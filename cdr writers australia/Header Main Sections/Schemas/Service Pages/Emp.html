      "@type": "FAQPage",
      "@id": "https://cdrwritersaustralia.com/#faq",
      "url": "https://cdrwritersaustralia.com/employment-reference-letter/",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is an employment reference letter?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An employment reference letter, also called an employment verification letter or work experience letter, is a document issued by your employer that confirms your job title, employment dates, weekly hours, duties and pay. Assessing authorities use it to check that your experience matches the occupation you nominated."
          }
        },
        {
          "@type": "Question",
          "name": "What should an employment reference letter include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It should include company letterhead with the employer's name, address and website, your full name, the letter date, each job title, DD/MM/YYYY start and end dates, employment status, minimum weekly hours, work location, your duties, your salary and benefits, and a signature and date from an authorized person with their full name, position, phone number and work email."
          }
        },
        {
          "@type": "Question",
          "name": "How many hours per week must I have worked for the experience to count?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Many assessors, including VETASSESS and Engineers Australia, count paid employment of at least 20 hours a week, whether it was full-time, part-time or casual. Always confirm the threshold in your own assessing authority's guide."
          }
        },
        {
          "@type": "Question",
          "name": "Can I copy my duties from the ANZSCO description?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Duties copied from the ANZSCO or from another letter are not accepted by assessors such as the Australian Computer Society. Describe what you actually did in your own words, and make sure those tasks align with the occupation you are nominating."
          }
        },
        {
          "@type": "Question",
          "name": "Who should sign my employment reference letter?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An authorized person at the employer, such as a manager, supervisor or HR officer, should sign and date it and list their position, phone number and work email address. For trade occupations, VETASSESS also asks the signer to confirm they were your owner or supervisor."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need payslips and tax documents as well as the letter?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Usually yes. Assessors want official evidence of pay alongside the letter, such as payslips, tax documents, bank statements or superannuation records. The exact documents differ by authority, so check the evidence list for yours."
          }
        },
        {
          "@type": "Question",
          "name": "What if my employer has closed or I cannot contact them?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You may be able to submit a statutory declaration describing your duties, together with proof of pay and evidence that the business has closed. VETASSESS accepts this for some professional occupations but not for trades, so check what your assessor allows before you rely on it."
          }
        },
        {
          "@type": "Question",
          "name": "What if I am self-employed or worked through an agency?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For agency placements, ACS asks for a reference from the host company where you actually worked. If you were self-employed or have no employer reference, ACS accepts a statutory declaration or affidavit, and VETASSESS asks professional applicants for client evidence and a letter from an accountant reporting your income."
          }
        },
        {
          "@type": "Question",
          "name": "How does an employment reference letter help with subclass 189, 190 and 491 visas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "These skilled visas require a positive skills assessment, and your assessed work experience supports it. A clear, verifiable letter makes it easier for the assessor to recognize your experience and for you to back up the work history you claim in your visa application."
          }
        },
        {
          "@type": "Question",
          "name": "Do you write employment reference letters for every occupation and assessing authority?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We prepare employment reference letters for a wide range of occupations and assessing authorities. We draft from your genuine experience for your employer to review and sign, and we never invent experience or sign for an employer."
          }
        }
      ]

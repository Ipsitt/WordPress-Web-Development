<!--
  Consultation card + form block for CDR Writers Australia
  Drop this into a WordPress "Raw HTML" / "Custom HTML" block.

  Edit only the config variables at the top of the script to change destinations.
-->

<style>
  :root{
    --consultation-red: #b82d2d;
    --consultation-red-hover: #e53e3e;
    --consultation-text: #344054;
    --consultation-muted: #667085;
    --consultation-border: #e4e7ec;
    --consultation-shadow: 0 18px 60px rgba(15, 23, 42, 0.18);
  }

  .consultation-stack{
    display: grid;
    gap: 18px;
    max-width: 760px;
    width: 100%;
    min-width: 0;
    margin: 0 auto;
    padding: 12px;
    box-sizing: border-box;
    animation: none !important;
  }

  .consultation-stack *{
    box-sizing: border-box;
    animation: none !important;
  }

  .consultation-form-card{
    border-radius: 22px;
    box-shadow: var(--consultation-shadow);
    overflow: hidden;
  }

  .consultation-form-card{
    background: transparent;
    padding: 0;
    width: 100%;
    min-width: 0;
  }

  .consultation-form{
    background: #ffffff;
    border-radius: 22px;
    padding: 22px;
    padding-bottom: 18px;
    width: 100%;
    min-width: 0;
  }

  .consultation-form__header{
    text-align: center;
    margin-bottom: 20px;
  }

  .consultation-form__header h3{
    margin: 0;
    font-size: clamp(24px, 4vw, 32px);
    line-height: 1.1;
    color: var(--consultation-text);
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 800 !important;
    letter-spacing: -0.03em;
  }

  .consultation-form__header p{
    margin: 10px 0 0;
    color: var(--consultation-text);
    font-size: 16px;
    line-height: 1.5;
  }

  .consultation-form__grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .consultation-field{
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .consultation-field--full{
    grid-column: 1 / -1;
  }

  .consultation-field label{
    font-size: 16px;
    color: #3f3f46;
    font-weight: 500;
  }

  .consultation-input,
  .consultation-textarea,
  .iti input.consultation-input{
    width: 100%;
    height: 40px !important;
    min-height: 40px !important;
    border: 1.5px solid #f3f4f6;
    background: #f8f8f9;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 16px;
    color: #111827 !important;
    -webkit-text-fill-color: #111827 !important;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }

  .consultation-textarea{
    height: 40px !important;
    min-height: 40px !important;
    padding-top: 8px;
    padding-bottom: 8px;
    resize: none;
    overflow: hidden;
  }

  .consultation-input:hover,
  .consultation-textarea:hover{
    border-color: var(--consultation-red);
  }

  .consultation-input:focus,
  .consultation-textarea:focus{
    border-color: var(--consultation-red);
    box-shadow: 0 0 0 3px rgba(184, 45, 45, 0.12);
    background: #ffffff;
  }

  .consultation-input::placeholder,
  .consultation-textarea::placeholder{
    color: #b8b8b8 !important;
    opacity: 1 !important;
    -webkit-text-fill-color: #b8b8b8 !important;
  }

  .consultation-phone-wrap{
    position: relative;
  }

  .consultation-form .iti{
    width: 100%;
  }

  .iti__country-list{
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 14px 32px rgba(15, 23, 42, 0.18);
    max-height: 280px;
    width: 320px !important;
    max-width: calc(100vw - 24px);
    overflow-x: hidden;
  }

  .iti__country{
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .iti__country-name{
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .iti__dial-code{
    margin-left: auto;
    white-space: nowrap;
  }

  .iti__selected-country,
  .iti__selected-country:hover,
  .iti__selected-country:focus,
  .consultation-form .iti__selected-country,
  .consultation-form .iti__selected-country:hover,
  .consultation-form .iti__selected-country:focus,
  .consultation-form .iti__selected-flag,
  .consultation-form .iti__selected-flag:hover,
  .consultation-form .iti__selected-flag:focus,
  .consultation-form .iti__selected-flag[aria-expanded="true"]{
    border-radius: 10px 0 0 10px;
    padding-left: 12px;
    padding-right: 12px;
    background: transparent !important;
    background-color: transparent !important;
    box-shadow: none !important;
    filter: none !important;
    transform: none !important;
    translate: none !important;
    animation: none !important;
    transition: none !important;
    display: flex !important;
    align-items: center !important;
  }

  .consultation-form .iti__selected-dial-code{
    color: #111827;
  }

  .consultation-submit{
    width: 100%;
    min-height: 50px;
    border: 0;
    border-radius: 8px;
    background: var(--consultation-red);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: none !important;
  }

  .consultation-submit:hover{
    transform: none !important;
    background: #a52828;
    transition: none !important;
    position: static;
  }

  .consultation-footer-note{
    margin: 14px 0 0;
    color: #8c8c8c;
    font-size: 14px;
    line-height: 1.4;
  }

  @media (max-width: 720px){
    .consultation-stack{
      padding: 8px;
    }

    .consultation-form{
      padding: 18px;
      border-radius: 18px;
    }

    .consultation-form__grid{
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 480px){
    .consultation-form__header p,
    .consultation-field label,
    .consultation-input,
    .consultation-textarea,
    .consultation-submit{
      font-size: 16px;
    }
  }
</style>

<div class="consultation-stack">
  <section class="consultation-form-card" aria-labelledby="consultation-form-title">
    <form class="consultation-form" id="consultationForm">
      <div class="consultation-form__header">
        <h3 id="consultation-form-title">Get Free Expert Consultation</h3>
      </div>

      <div class="consultation-form__grid">
        <div class="consultation-field consultation-field--full">
          <label for="consultationName">Name *</label>
          <input class="consultation-input" id="consultationName" name="name" type="text" placeholder="John Smith" required>
        </div>

        <div class="consultation-field consultation-field--full">
          <label for="consultationEmail">Email address *</label>
          <input class="consultation-input" id="consultationEmail" name="email" type="email" placeholder="*****@gmail.com" required>
        </div>

        <div class="consultation-field consultation-field--full">
          <label for="consultationPhone">Phone *</label>
          <div class="consultation-phone-wrap">
            <input class="consultation-input" id="consultationPhone" name="phone" type="tel" placeholder="000 000 ..." required>
          </div>
        </div>

        <div class="consultation-field consultation-field--full">
          <label for="consultationMessage">Message</label>
          <input class="consultation-input" id="consultationMessage" name="message" type="text">
        </div>

        <div class="consultation-field consultation-field--full">
          <button class="consultation-submit" type="submit">Claim Free Consultation</button>
        </div>
      </div>

    </form>
  </section>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@24.6.1/build/css/intlTelInput.css">
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@24.6.1/build/js/intlTelInput.min.js"></script>

<script>
(function () {
  // Keep the WhatsApp destination easy to edit from the top of the code.
  const WHATSAPP_URL = "https://api.whatsapp.com/send/?phone=%2B61482085705&text=";

  const form = document.getElementById("consultationForm");
  const phoneInput = document.getElementById("consultationPhone");
  let phoneInstance = null;

  if (form) {
    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("consultationName").value.trim();
      const email = document.getElementById("consultationEmail").value.trim();
      const message = document.getElementById("consultationMessage").value.trim();
      const phone = phoneInstance && phoneInstance.getNumber
        ? phoneInstance.getNumber()
        : phoneInput.value.trim();

      const whatsappMessage = [
        "Message: " + message,
        "Name: " + name,
        "Email: " + email,
        "Phone: " + phone
      ].join("\\n");

      window.location.href = WHATSAPP_URL + encodeURIComponent(whatsappMessage) + "&type=phone_number&app_absent=0";
    });
  }

  if (window.intlTelInput && phoneInput) {
    phoneInstance = window.intlTelInput(phoneInput, {
      initialCountry: "us",
      preferredCountries: ["us", "gb", "au", "ca", "in"],
      nationalMode: false,
      autoPlaceholder: "polite",
      separateDialCode: true,
      formatOnDisplay: false,
      dropdownContainer: document.body,
      geoIpLookup: function (success) {
        success("us");
      }
    });

    phoneInput.placeholder = "000 000 ...";

    function removePhoneSelectorTooltip() {
      const selector = phoneInput.closest(".iti");
      if (!selector) return;

      const countryButton = selector.querySelector(".iti__selected-country");
      const selectedFlag = selector.querySelector(".iti__selected-flag");
      if (countryButton) countryButton.removeAttribute("title");
      if (selectedFlag) selectedFlag.removeAttribute("title");
    }

    removePhoneSelectorTooltip();

    phoneInput.addEventListener("countrychange", function () {
      phoneInput.placeholder = "000 000 ...";
      removePhoneSelectorTooltip();
    });
  }
})();
</script>
